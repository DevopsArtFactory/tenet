<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tenet Control Plane</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07111f;
        --panel: rgba(11, 24, 43, 0.9);
        --panel-2: rgba(21, 37, 63, 0.88);
        --line: rgba(120, 160, 255, 0.16);
        --text: #ebf2ff;
        --muted: #94a8c7;
        --green: #45d483;
        --yellow: #f4c95d;
        --blue: #67b7ff;
        --red: #ff7b7b;
        --purple: #a78bfa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: radial-gradient(circle at top, #12305f 0%, var(--bg) 45%, #030814 100%);
        color: var(--text);
      }
      .shell { max-width: 1280px; margin: 0 auto; padding: 32px 20px 56px; }
      .hero { display: flex; justify-content: space-between; gap: 16px; align-items: end; margin-bottom: 24px; }
      .title { font-size: 36px; font-weight: 800; letter-spacing: -0.04em; margin: 0 0 8px; }
      .subtitle { margin: 0; color: var(--muted); max-width: 720px; line-height: 1.5; }
      .toolbar { display:grid; gap: 16px; margin-bottom: 24px; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 18px 40px rgba(0,0,0,0.24); }
      .toolbar-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
      .toolbar-field { display:grid; gap: 8px; }
      .toolbar-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
      .toolbar-input, .toolbar-select { width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); color: var(--text); padding: 12px 14px; font: inherit; }
      .toolbar-input::placeholder { color: rgba(148,168,199,.72); }
      .toolbar-input:focus, .toolbar-select:focus, .toolbar-button:focus-visible { outline: 2px solid rgba(103,183,255,.45); outline-offset: 2px; }
      .toolbar-actions { display:flex; flex-wrap:wrap; gap: 10px; align-items:center; justify-content:space-between; }
      .toolbar-active { color: var(--muted); font-size: 14px; }
      .toolbar-button { border: 1px solid rgba(103,183,255,.24); background: rgba(103,183,255,.12); color: var(--blue); border-radius: 999px; padding: 10px 14px; font: inherit; font-weight: 700; cursor: pointer; }
      .toolbar-button:hover { background: rgba(103,183,255,.18); }
      .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
      .card, .account { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 18px 40px rgba(0,0,0,0.24); }
      .card { padding: 18px; }
      .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
      .value { font-size: 28px; font-weight: 800; margin-top: 8px; }
      .accounts { display: grid; gap: 20px; }
      .account { padding: 20px; }
      .account-head { display:flex; justify-content:space-between; gap:16px; align-items:start; margin-bottom: 16px; }
      .account-name { margin:0; font-size: 24px; }
      .account-meta { color: var(--muted); font-size: 14px; margin-top: 6px; }
      .rows { display:grid; gap: 16px; }
      .deployment-group { display:grid; gap: 12px; }
      .deployment-group-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; padding: 0 4px; }
      .deployment-group-title { margin:0; font-size: 16px; }
      .deployment-group-meta, .account-topology { color: var(--muted); font-size: 13px; margin-top: 6px; }
      .group-pill { padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid rgba(103,183,255,.24); color: var(--blue); background: rgba(103,183,255,.08); }
      .group-rows { display:grid; gap: 12px; }
      .row { background: var(--panel-2); border: 1px solid rgba(255,255,255,.06); border-radius: 16px; display:grid; gap: 14px; overflow: clip; }
      .row.expanded { border-color: rgba(103,183,255,.28); box-shadow: inset 0 0 0 1px rgba(103,183,255,.12); }
      .row-toggle { width: 100%; border: 0; background: transparent; color: inherit; padding: 16px; display:grid; gap: 14px; text-align: left; cursor: pointer; }
      .row-toggle:hover, .row-toggle:focus-visible { background: rgba(255,255,255,.03); }
      .row-toggle:focus-visible { outline: 2px solid rgba(103,183,255,.45); outline-offset: -2px; }
      .row-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
      .row-title { margin:0; font-size: 18px; }
      .row-subtitle { margin-top:6px; color: var(--muted); font-size: 14px; }
      .row-links { display:flex; flex-wrap:wrap; gap: 10px; margin-top: 10px; }
      .account-links { margin-top: 0; align-self: center; }
      .row-links-shell { padding: 0 16px 16px; }
      .row-link { color: var(--blue); font-size: 13px; font-weight: 600; text-decoration: none; }
      .row-link:hover, .row-link:focus-visible { text-decoration: underline; }
      .row-hint { margin-top: 10px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
      .pills { display:flex; flex-wrap:wrap; gap:8px; }
      .pill { padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
      .pill.target { background: rgba(103,183,255,.12); color: var(--blue); border-color: rgba(103,183,255,.24); }
      .pill.strategy { background: rgba(167,139,250,.12); color: var(--purple); border-color: rgba(167,139,250,.28); }
      .pill.mode { background: rgba(244,201,93,.12); color: var(--yellow); border-color: rgba(244,201,93,.28); }
      .pill.synced { background: rgba(69,212,131,.12); color: var(--green); border-color: rgba(69,212,131,.24); }
      .pill.progress { background: rgba(244,201,93,.12); color: var(--yellow); border-color: rgba(244,201,93,.28); }
      .pill.paused { background: rgba(148,168,199,.12); color: var(--muted); border-color: rgba(148,168,199,.24); }
      .pill.error { background: rgba(255,123,123,.12); color: var(--red); border-color: rgba(255,123,123,.24); }
      .metrics { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
      .metric { padding: 12px; border-radius: 14px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05); }
      .metric .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
      .metric .v { margin-top: 8px; font-size: 14px; font-weight: 650; word-break: break-word; }
      .metric.summary { grid-column: 1 / -1; }
      .detail-panel { padding: 0 16px 16px; display:grid; gap: 12px; }
      .detail-state { padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,.06); background: rgba(255,255,255,.03); color: var(--muted); }
      .detail-state.error { border-color: rgba(255,123,123,.28); color: #ffd0d0; }
      .detail-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
      .detail-section { padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,.05); background: rgba(255,255,255,.03); }
      .detail-section h4 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
      .detail-list { margin: 0; padding-left: 18px; display:grid; gap: 8px; }
      .detail-list li::marker { color: var(--blue); }
      .detail-step-meta, .detail-condition-meta { display:block; margin-top: 4px; color: var(--muted); font-size: 13px; }
      .detail-step-meta-completed { color: var(--green); }
      .detail-step-meta-current { color: var(--blue); }
      .detail-step-meta-pending { color: var(--muted); }
      .detail-execution-meta, .detail-history-meta { display:grid; gap: 4px; margin-top: 6px; }
      .empty, .loading { padding: 32px; text-align:center; color: var(--muted); background: var(--panel); border:1px solid var(--line); border-radius:20px; }
      @media (max-width: 720px) {
        .hero, .row-top, .account-head { flex-direction: column; align-items: stretch; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="hero">
        <div>
          <h1 class="title">Tenet Control Plane</h1>
          <p class="subtitle">Account-oriented rollout visibility for EC2 binaries and ECS images, with strategy-aware step labels such as ShiftTrafficCanary and CreateCodeDeployDeployment for weighted-target-group and ECS CodeDeploy rollouts.</p>
        </div>
      </div>
      <section class="toolbar" id="toolbar"></section>
      <section class="summary" id="summary"></section>
      <section id="accounts" class="accounts">
        <div class="loading">Loading deployment overview…</div>
      </section>
    </div>
    <script>
      const detailStateByDeployment = new Map();
      let allAccounts = [];
      let allApplications = [];
      let currentViewState = { query: '', syncState: 'all', account: 'all' };
      let currentPageState = { page: 'applications', deployment: '' };

      const statusClass = (state) => {
        switch (state) {
          case 'Synced':
            return 'synced';
          case 'Reconciling':
          case 'OutOfSync':
          case 'Drifted':
            return 'progress';
          case 'Paused':
            return 'paused';
          case 'Error':
            return 'error';
          default:
            return '';
        }
      };
      const healthClass = (overall) => {
        switch (overall) {
          case 'Healthy':
            return 'synced';
          case 'Progressing':
            return 'progress';
          case 'Unhealthy':
            return 'error';
          default:
            return '';
        }
      };

      const healthLabel = (health) => health?.overall || 'Unknown';
      const artifact = (obj) => obj?.binary || obj?.image || '—';
      const boolLabel = (value) => value ? 'True' : 'False';
      const textOrDash = (value) => value || '—';
      const runtimeSummaryTimestamp = (runtimeSummary) => runtimeSummary?.timestamp || 'Latest runtime status';
      const runtimeSummaryText = (runtimeSummary) => {
        if (!runtimeSummary) return '—';
        const labels = changeLabels(runtimeSummary?.changes);
        const parts = [
          runtimeSummary.summary,
          runtimeSummary.sync?.state,
          runtimeSummary.sync?.reason,
          runtimeSummary.health?.overall,
          runtimeSummary.health?.summary,
          runtimeSummary.source,
          labels.length ? labels.join(', ') : '',
          runtimeSummary.rolloutPhase,
          runtimeSummary.currentStep,
          Number.isFinite(runtimeSummary.historyCount) ? `history ${runtimeSummary.historyCount}` : '',
        ].filter(Boolean);
        return parts.length ? parts.join(' · ') : '—';
      };
      const plannedSteps = (rollout) => {
        const steps = (rollout?.steps || []).map((step) => step.kind).filter(Boolean);
        return steps.length ? steps.join(' → ') : '—';
      };
      const metricValue = (value) => value ?? '—';
      const generationValue = (value) => Number.isFinite(value) ? String(value) : '—';
      const generationsText = (value) => {
        const desired = generationValue(value?.desiredGeneration);
        const observed = generationValue(value?.observedGeneration);
        return `desired ${desired} · observed ${observed}`;
      };
      const changeLabels = (changes) => (changes || []).filter((change) => typeof change === 'string' && change);
      const changeLabelsText = (changes) => {
        const labels = changeLabels(changes);
        return labels.length ? labels.join(', ') : '—';
      };
      const latestRuntimeTimestamp = (applications) => applications
        .map((deployment) => deployment.runtimeSummary?.timestamp)
        .filter((value) => typeof value === 'string' && value)
        .sort()
        .at(-1) || '—';
      const rolloutStepStatus = (step, index, steps) => {
        if (step.status) {
          switch (step.status) {
            case 'completed':
              return 'completed';
            case 'current':
              return 'current';
            case 'pending':
              return 'pending';
            default:
              break;
          }
        }

        const currentIndex = steps.findIndex((candidate) => candidate.current);
        if (currentIndex === -1) return step.current ? 'current' : 'pending';
        if (step.current) return 'current';
        if (index < currentIndex) return 'completed';
        return 'pending';
      };
      const rolloutStepStatusLabel = (status) => {
        switch (status) {
          case 'completed':
            return 'Completed rollout step';
          case 'current':
            return 'Current rollout step';
          default:
            return 'Pending rollout step';
        }
      };
      const deriveAccountCounts = (account) => {
        const deployments = account.deployments || [];
        const counts = {
          deploymentCount: deployments.length,
          syncedCount: 0,
          progressingCount: 0,
          pausedCount: 0,
          errorCount: 0,
        };

        deployments.forEach((deployment) => {
          switch (deployment.sync?.state) {
            case 'Synced':
              counts.syncedCount += 1;
              break;
            case 'Reconciling':
            case 'OutOfSync':
            case 'Drifted':
              counts.progressingCount += 1;
              break;
            case 'Paused':
              counts.pausedCount += 1;
              break;
            case 'Error':
              counts.errorCount += 1;
              break;
            default:
              break;
          }
        });

        return counts;
      };
      const deriveProjectEnvironmentGroups = (account) => {
        const projects = new Set();
        const environments = new Set();
        const groups = new Map();

        (account.deployments || []).forEach((deployment) => {
          if (deployment.appRef) projects.add(deployment.appRef);
          if (deployment.environmentRef) environments.add(deployment.environmentRef);

          const key = [deployment.appRef || '', deployment.environmentRef || '', deployment.region || ''].join('\u0000');
          if (!groups.has(key)) {
            groups.set(key, {
              key,
              appRef: deployment.appRef,
              environmentRef: deployment.environmentRef,
              region: deployment.region,
              deployments: [],
            });
          }
          groups.get(key).deployments.push(deployment);
        });

        return {
          projectCount: projects.size,
          environmentCount: environments.size,
          groups: Array.from(groups.values()),
        };
      };
      const deriveGroupCounts = (group) => {
        const deployments = group.deployments || [];
        const counts = {
          deploymentCount: deployments.length,
          syncedCount: 0,
          progressingCount: 0,
          pausedCount: 0,
          errorCount: 0,
        };

        deployments.forEach((deployment) => {
          switch (deployment.sync?.state) {
            case 'Synced':
              counts.syncedCount += 1;
              break;
            case 'Reconciling':
            case 'OutOfSync':
            case 'Drifted':
              counts.progressingCount += 1;
              break;
            case 'Paused':
              counts.pausedCount += 1;
              break;
            case 'Error':
              counts.errorCount += 1;
              break;
            default:
              break;
          }
        });

        return counts;
      };
      const createElement = (tagName, className, text) => {
        const node = document.createElement(tagName);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };
      const createMetric = (label, value, className = '') => {
        const metric = createElement('div', 'metric');
        if (className) metric.classList.add(className);
        metric.append(
          createElement('div', 'k', label),
          createElement('div', 'v', value),
        );
        return metric;
      };
      const createNavLink = (href, text, target = '_blank') => {
        const link = createElement('a', 'row-link', text);
        link.href = href;
        link.target = target;
        link.rel = target === '_blank' ? 'noreferrer noopener' : '';
        return link;
      };
      const stableResourceIdentity = (resource) => {
        const type = resource.type || resource.resource || 'resource';
        const name = resource.name || type;
        const description = resource.description || '—';
        return [type, name, description].join('::');
      };
      const normalizeResource = (resource) => {
        const type = resource.resource || 'resource';
        const name = resource.name || type;
        const description = resource.description || '—';
        const resourceId = stableResourceIdentity({ type, name, description });
        return {
          id: resourceId,
          type,
          name,
          description,
        };
      };
      const canonicalUserDataBootstrapSource = (userData) => {
        if (!userData || (!userData.type && !userData.path)) return 'unspecified';
        if (!userData.path) return userData.type || 'unspecified';
        if (!userData.type) return userData.path;
        return `${userData.type}:${userData.path}`;
      };
      const canonicalRolloutExecutionFallback = (detail) => {
        if (detail.executionMode === 'ecsCodeDeploy') {
          return [
            { resource: 'ecsService', name: `${detail.name}-service`, description: 'ECS service Tenet updates during deployment' },
            { resource: 'codeDeployApplication', name: `${detail.name}-codedeploy-app`, description: 'CodeDeploy application coordinating ECS traffic shifting' },
            { resource: 'codeDeployDeploymentGroup', name: `${detail.name}-codedeploy-group`, description: 'CodeDeploy deployment group Tenet targets for ECS rollout' },
            { resource: 'productionListener', name: `${detail.name}-prod-listener`, description: 'Production listener CodeDeploy shifts during ECS blue/green rollout' },
            { resource: 'testListener', name: `${detail.name}-test-listener`, description: 'Test listener CodeDeploy uses to validate the replacement ECS task set before promotion' },
            { resource: 'blueTaskSetTargetGroup', name: `${detail.name}-blue`, description: 'Blue task set target group CodeDeploy treats as the live ECS traffic destination' },
            { resource: 'greenTaskSetTargetGroup', name: `${detail.name}-green`, description: 'Green task set target group CodeDeploy warms before shifting ECS traffic' },
          ];
        }
        if (detail.executionMode === 'asgWeightedTargetGroups') {
          return [
            { resource: 'candidateAutoScalingGroup', name: `${detail.name}-candidate`, description: 'Candidate Auto Scaling Group Tenet will create for weighted target group rollout' },
            { resource: 'activeTargetGroup', name: `${detail.name}-active`, description: 'Currently active target group receiving production traffic' },
            { resource: 'candidateTargetGroup', name: `${detail.name}-candidate`, description: 'Candidate target group Tenet will register and warm before traffic shifting' },
            { resource: 'productionListenerRule', name: `${detail.name}-prod-listener`, description: 'Production listener rule operators inspect while Tenet updates weighted forwarding during rollout' },
            { resource: 'trafficShiftPlan', name: `${detail.name}-weighted-routing`, description: 'Weighted routing plan Tenet follows to move production traffic from the active target group to the candidate target group' },
            { resource: 'userDataBootstrapSource', name: canonicalUserDataBootstrapSource(detail.userData), description: 'Normalized userdata bootstrap source for candidate EC2 capacity' },
          ];
        }
        return [];
      };
      const rolloutExecutionResources = (detail) => {
        const execution = detail.rollout?.execution || [];
        return execution.length ? execution : canonicalRolloutExecutionFallback(detail);
      };
      const createSelect = (labelText, value, options, onChange) => {
        const field = createElement('label', 'toolbar-field');
        field.append(createElement('span', 'toolbar-label', labelText));
        const select = createElement('select', 'toolbar-select');
        select.dataset.toolbarField = labelText;
        options.forEach((option) => {
          const node = document.createElement('option');
          node.value = option.value;
          node.textContent = option.label;
          node.selected = option.value === value;
          select.append(node);
        });
        select.addEventListener('change', onChange);
        field.append(select);
        return field;
      };
      const createInput = (labelText, value, placeholder, onInput) => {
        const field = createElement('label', 'toolbar-field');
        field.append(createElement('span', 'toolbar-label', labelText));
        const input = createElement('input', 'toolbar-input');
        input.dataset.toolbarField = labelText;
        input.type = 'search';
        input.value = value;
        input.placeholder = placeholder;
        input.autocomplete = 'off';
        input.addEventListener('input', onInput);
        field.append(input);
        return field;
      };
      const captureToolbarFocus = () => {
        const active = document.activeElement;
        if (!(active instanceof HTMLElement)) return null;
        const field = active.dataset.toolbarField;
        if (!field) return null;
        return {
          field,
          selectionStart: typeof active.selectionStart === 'number' ? active.selectionStart : null,
          selectionEnd: typeof active.selectionEnd === 'number' ? active.selectionEnd : null,
        };
      };
      const restoreToolbarFocus = (focusState) => {
        if (!focusState?.field) return;
        const selector = `[data-toolbar-field="${focusState.field}"]`;
        const node = document.querySelector(selector);
        if (!(node instanceof HTMLElement)) return;
        node.focus();
        if (node instanceof HTMLInputElement && focusState.selectionStart !== null && focusState.selectionEnd !== null) {
          node.setSelectionRange(focusState.selectionStart, focusState.selectionEnd);
        }
      };
      const parseViewState = () => {
        const params = new URLSearchParams(window.location.search);
        return {
          query: params.get('q') || '',
          syncState: params.get('sync') || 'all',
          account: params.get('account') || 'all',
        };
      };
      const parsePageState = () => {
        const params = new URLSearchParams(window.location.search);
        const page = params.get('page') || params.get('view') || 'applications';
        const validPages = new Set(['applications', 'application', 'resource', 'drift', 'plan']);
        return {
          page: validPages.has(page) ? page : 'applications',
          deployment: params.get('deployment') || '',
          resourceType: params.get('resourceType') || '',
          resourceId: params.get('resourceId') || '',
        };
      };
      const normalizeViewState = (applications, state) => {
        const validSyncStates = new Set([
          'all',
          'Synced',
          'Reconciling',
          'OutOfSync',
          'Drifted',
          'Paused',
          'Error',
        ]);
        const validAccounts = new Set(['all', ...applications.map((application) => application.awsAccountId).filter(Boolean)]);
        return {
          query: (state.query || '').trim(),
          syncState: validSyncStates.has(state.syncState) ? state.syncState : 'all',
          account: validAccounts.has(state.account) ? state.account : 'all',
        };
      };
      const syncViewState = (state) => {
        const params = new URLSearchParams(window.location.search);
        if (state.query) {
          params.set('q', state.query);
        } else {
          params.delete('q');
        }
        if (state.syncState !== 'all') {
          params.set('sync', state.syncState);
        } else {
          params.delete('sync');
        }
        if (state.account !== 'all') {
          params.set('account', state.account);
        } else {
          params.delete('account');
        }
        const query = params.toString();
        const hash = window.location.hash || '';
        const nextURL = query ? `${window.location.pathname}?${query}${hash}` : `${window.location.pathname}${hash}`;
        history.replaceState({}, '', nextURL);
      };
      const buildPageURL = (page, extras = {}) => {
        const params = new URLSearchParams();
        params.set('page', page);
        if (currentViewState.query) params.set('q', currentViewState.query);
        if (currentViewState.syncState && currentViewState.syncState !== 'all') params.set('sync', currentViewState.syncState);
        if (currentViewState.account && currentViewState.account !== 'all') params.set('account', currentViewState.account);
        Object.entries(extras).forEach(([key, value]) => {
          if (value == null || value === '') return;
          params.set(key, value);
        });
        return `/?${params.toString()}`;
      };
      const updateViewState = (patch) => {
        const focusState = captureToolbarFocus();
        currentViewState = normalizeViewState(allApplications, { ...currentViewState, ...patch });
        syncViewState(currentViewState);
        renderApplicationsOverview(allApplications, focusState);
      };
      const applyViewState = (applications, state) => {
        const searchNeedle = state.query.trim().toLowerCase();
        return applications.filter((deployment) => {
          const matchesAccount = state.account === 'all' || deployment.awsAccountId === state.account;
          const matchesState = state.syncState === 'all' || deployment.sync?.state === state.syncState;
          const searchHaystack = [
            deployment.accountName,
            deployment.awsAccountId,
            deployment.name,
            deployment.appRef,
            deployment.environmentRef,
            deployment.region,
            deployment.targetType,
            deployment.strategy,
            deployment.executionMode,
            deployment.sync?.state,
            deployment.sync?.reason,

          ['Latest runtime', runtimeSummaryText(detail.runtimeSummary)],
        ].forEach(([label, value]) => {
          workspaceSummary.append(createMetric(label, value, label === 'Latest runtime' ? 'summary' : ''));
        });
        summary.replaceChildren(workspaceSummary);

        const sections = [];
        const runtimeSignalsSection = createDetailSection('Latest runtime signals');
        const runtimeSignals = createElement('div', 'detail-grid');
        [
          ['Runtime source', metricValue(detail.runtimeSummary?.source)],
          ['Runtime timestamp', metricValue(detail.runtimeSummary?.timestamp)],
          ['Runtime history', Number.isFinite(detail.runtimeSummary?.historyCount) ? String(detail.runtimeSummary.historyCount) : '—'],
        ].forEach(([label, value]) => {
          runtimeSignals.append(createMetric(label, value));
        });
        runtimeSignalsSection.append(runtimeSignals);
        const runtimeChanges = detail.runtimeSummary?.changes || [];
        if (!runtimeChanges.length) {
          runtimeSignalsSection.append(createElement('div', 'detail-state', 'No runtime change signals are currently reported.'));
        } else {
          const runtimeChangesList = createElement('ul', 'detail-list');
          runtimeChanges.forEach((change) => {
            runtimeChangesList.append(createElement('li', '', textOrDash(change)));
          });
          runtimeSignalsSection.append(runtimeChangesList);
        }
        sections.push(runtimeSignalsSection);

        const executionSection = createDetailSection('Rollout execution');
        const execution = detail.rollout?.execution || [];
        if (!execution.length) {
          executionSection.append(createElement('div', 'detail-state', 'No rollout execution resources are currently reported.'));
        } else {
          const executionList = createElement('ol', 'detail-list');
          execution.forEach((item) => {
            const executionItem = createElement('li');
            executionItem.append(createElement('strong', '', textOrDash(item.name)));
            const executionMeta = createElement('div', 'detail-execution-meta');
            executionMeta.append(
              createElement('span', 'detail-condition-meta', `Execution resource · ${textOrDash(item.resource)}`),
              createElement('span', 'detail-condition-meta', `Execution description · ${textOrDash(item.description)}`),
            );
            executionItem.append(executionMeta);
            executionList.append(executionItem);
          });
          executionSection.append(executionList);
        }
        sections.push(executionSection);

        if (mode === 'drift') {
          const driftSection = createDetailSection(emptyTitle);
          driftSection.append(createElement('div', 'detail-state', 'Field-level drift is not yet available from the current read model.'));
          sections.push(driftSection);

          const conditionsSection = createDetailSection('Status conditions');
          const conditions = detail.conditions || [];
          if (!conditions.length) {
            conditionsSection.append(createElement('div', 'detail-state', 'No deployment conditions are currently reported.'));
          } else {
            const conditionList = createElement('ul', 'detail-list');
            conditions.forEach((condition) => {
              const item = createElement('li');
              item.append(createElement('strong', '', textOrDash(condition.type)));
              item.append(createElement('span', 'detail-condition-meta', `Condition status · ${boolLabel(condition.status)}`));
              if (condition.reason) {
                item.append(createElement('span', 'detail-condition-meta', `Condition reason · ${condition.reason}`));
              }
              if (condition.message) {
                item.append(createElement('span', 'detail-condition-meta', `Condition message · ${condition.message}`));
              }
              conditionList.append(item);
            });
            conditionsSection.append(conditionList);
          }
          sections.push(conditionsSection);
        } else {
          const actionsSection = createDetailSection('Plan/apply actions');
          const actionBar = createElement('div', 'row-links');
          const createPlanButton = createElement('button', 'toolbar-button', 'Create Plan');
          createPlanButton.type = 'button';
          createPlanButton.disabled = true;
          const applyPlanButton = createElement('button', 'toolbar-button', 'Apply Plan');
          applyPlanButton.type = 'button';
          applyPlanButton.disabled = true;
          actionBar.append(createPlanButton, applyPlanButton);
          actionsSection.append(
            actionBar,
            createElement('div', 'detail-state', 'Plan/apply controls are not wired to mutation APIs in this read-only slice yet.'),
          );
          sections.push(actionsSection);

          const planSection = createDetailSection(emptyTitle);
          const steps = detail.rollout?.steps || [];
          if (!steps.length) {
            planSection.append(createElement('div', 'detail-state', 'No rollout plan steps are currently available.'));
          } else {
            const stepList = createElement('ol', 'detail-list');
            steps.forEach((step, index) => {
              const item = createElement('li');
              item.append(createElement('strong', '', textOrDash(step.kind)));
              const stepStatus = rolloutStepStatus(step, index, steps);
              item.append(createElement('span', `detail-step-meta detail-step-meta-${stepStatus}`, rolloutStepStatusLabel(stepStatus)));
              if (step.detail) {
                item.append(createElement('span', 'detail-condition-meta', `Step detail · ${step.detail}`));
              }
              stepList.append(item);
            });
            planSection.append(stepList);
          }
          sections.push(planSection);
        }

        header.append(head, ...sections);
        root.replaceChildren(header);
      };

      const renderSummary = (accounts) => {
        const deployments = accounts.flatMap((account) => account.deployments || []);
        const synced = deployments.filter((deployment) => deployment.sync?.state === 'Synced').length;
        const progressingStates = new Set(['Reconciling', 'OutOfSync', 'Drifted']);
        const progressing = deployments.filter((deployment) => progressingStates.has(deployment.sync?.state)).length;
        const paused = deployments.filter((deployment) => deployment.sync?.state === 'Paused').length;
        const errored = deployments.filter((deployment) => deployment.sync?.state === 'Error').length;
        const summary = document.getElementById('summary');
        summary.replaceChildren(...[
          ['Accounts', accounts.length],
          ['Deployments', deployments.length],
          ['Synced', synced],
          ['Progressing', progressing],
          ['Paused', paused],
          ['Error', errored],
        ].map(([label, value]) => {
          const card = createElement('div', 'card');
          card.append(
            createElement('div', 'label', String(label)),
            createElement('div', 'value', String(value)),
          );
          return card;
        }));
      };

      const renderAccounts = (accounts) => {
        const root = document.getElementById('accounts');
        if (!accounts.length) {
          renderEmptyState('No accounts or deployments are loaded yet.');
          return;
        }

        const accountNodes = accounts.map((account) => {
          const article = createElement('article', 'account');
          const head = createElement('div', 'account-head');
          const titleWrap = createElement('div');
          const derivedTopology = deriveProjectEnvironmentGroups(account);
          const topology = {
            projectCount: account.projectCount ?? derivedTopology.projectCount,
            environmentCount: account.environmentCount ?? derivedTopology.environmentCount,
            groups: derivedTopology.groups,
          };
          titleWrap.append(
            createElement('h2', 'account-name', account.name || 'Unknown account'),
            createElement('div', 'account-meta', `AWS account ${metricValue(account.awsAccountId)} · Regions: ${(account.allowedRegions || []).join(', ') || '—'}`),
            createElement('div', 'account-topology', `${topology.projectCount} projects · ${topology.environmentCount} environments`),
          );
          const accountLinks = createElement('div', 'row-links');
          accountLinks.classList.add('account-links');
          if (account.awsAccountId) {
            accountLinks.append(createNavLink(`/v1/overview/accounts/${encodeURIComponent(account.awsAccountId)}`, 'Account JSON'));
          }
          const pills = createElement('div', 'pills');
          const fallbackCounts = deriveAccountCounts(account);
          const accountCountPills = [
            [account.deploymentCount ?? fallbackCounts.deploymentCount, 'deployments', 'pill target'],
            [account.syncedCount ?? fallbackCounts.syncedCount, 'synced', 'pill synced'],
            [account.progressingCount ?? fallbackCounts.progressingCount, 'progressing', 'pill progress'],
            [account.pausedCount ?? fallbackCounts.pausedCount, 'paused', 'pill paused'],
            [account.errorCount ?? fallbackCounts.errorCount, 'error', 'pill error'],
          ];
          accountCountPills.forEach(([value, label, className]) => {
            pills.append(createElement('span', className, `${value} ${label}`));
          });
          head.append(titleWrap, accountLinks, pills);

          const rows = createElement('div', 'rows');
          topology.groups.forEach((group) => {
            const groupSection = createElement('section', 'deployment-group');
            const groupHead = createElement('div', 'deployment-group-head');
            const groupTitleWrap = createElement('div');
            groupTitleWrap.append(
              createElement('h3', 'deployment-group-title', `${metricValue(group.appRef)} · ${metricValue(group.environmentRef)}`),
              createElement('div', 'deployment-group-meta', `Project ${metricValue(group.appRef)} · Environment ${metricValue(group.environmentRef)} · Region ${metricValue(group.region)}`),
            );
            const groupLinks = createElement('div', 'row-links');
            groupLinks.classList.add('group-links');
            if (account.awsAccountId && group.appRef && group.environmentRef) {
              groupLinks.append(createNavLink(`/v1/overview/accounts/${encodeURIComponent(account.awsAccountId)}/projects/${encodeURIComponent(group.appRef)}/environments/${encodeURIComponent(group.environmentRef)}`, 'Group JSON'));
            }
            const groupPills = createElement('div', 'pills');
            const groupCount = group.deployments.length;
            groupPills.append(createElement('span', 'group-pill', `${groupCount} deployment${groupCount === 1 ? '' : 's'}`));
            const groupCounts = deriveGroupCounts(group);
            [
              [groupCounts.syncedCount, 'synced', 'pill synced'],
              [groupCounts.progressingCount, 'progressing', 'pill progress'],
              [groupCounts.pausedCount, 'paused', 'pill paused'],
              [groupCounts.errorCount, 'error', 'pill error'],
            ].forEach(([value, label, className]) => {
              if (value > 0) {
                groupPills.append(createElement('span', className, `${value} ${label}`));
              }
            });
            groupHead.append(groupTitleWrap, groupLinks, groupPills);

            const groupRows = createElement('div', 'group-rows');
            group.deployments.forEach((deployment) => {
              const row = createElement('div', 'row');
              const toggle = createElement('button', 'row-toggle');
              toggle.type = 'button';
              toggle.setAttribute('aria-expanded', 'false');
              toggle.setAttribute('aria-label', `Expand details for ${deployment.name || 'deployment'}`);
              const rowTop = createElement('div', 'row-top');
              const rowTitleWrap = createElement('div');
              rowTitleWrap.append(
                createElement('h3', 'row-title', deployment.name || 'Unknown deployment'),
                createElement('div', 'row-subtitle', [deployment.appRef, deployment.environmentRef, deployment.region].filter(Boolean).join(' · ') || '—'),
                createElement('div', 'row-hint', 'Expand details'),
              );

              const rowPills = createElement('div', 'pills');
              [
                ['pill target', deployment.targetType || 'unknown target'],
                ['pill strategy', deployment.strategy || 'unknown strategy'],
                ['pill mode', deployment.executionMode || 'unassigned execution'],
                [`pill ${statusClass(deployment.sync?.state)}`, deployment.sync?.state || 'Unknown'],
              ].forEach(([className, text]) => {
                rowPills.append(createElement('span', className, text));
              });
              rowTop.append(rowTitleWrap, rowPills);

              const metrics = createElement('div', 'metrics');
              [
                ['Desired artifact', artifact(deployment.desiredArtifact)],
                ['Deployed artifact', artifact(deployment.deployedArtifact)],
                ['Latest runtime', runtimeSummaryText(deployment.runtimeSummary), 'summary'],
                ['Latest changes', changeLabelsText(deployment.runtimeSummary?.changes)],
                ['Runtime timestamp', runtimeSummaryTimestamp(deployment.runtimeSummary)],
                ['Runtime generations', generationsText(deployment.runtimeSummary)],
                ['Rollout phase', metricValue(deployment.rollout?.phase)],
                ['Current step', metricValue(deployment.rollout?.currentStep)],
                ['Rollout summary', metricValue(deployment.rollout?.summary), 'summary'],
                ['Planned steps', plannedSteps(deployment.rollout)],
                ['Health', `${healthLabel(deployment.health)}${deployment.health?.summary ? ` · ${deployment.health.summary}` : ''}`],
                ['Observed generation', generationValue(deployment.observedGeneration)],
              ].forEach(([label, value, className]) => {
                metrics.append(createMetric(label, value, className));
              });

              toggle.append(rowTop, metrics);

              const detailLinks = createElement('div', 'row-links row-links-shell');
              detailLinks.append(
                createNavLink(`/v1/overview/deployments/${encodeURIComponent(deployment.name)}`, 'Overview JSON'),
                createNavLink(`/v1/status/deployments/${encodeURIComponent(deployment.name)}`, 'Status JSON'),
                createNavLink(buildPageURL('drift', { deployment: deployment.name }), 'Drift view'),
                createNavLink(buildPageURL('plan', { deployment: deployment.name }), 'Plan/apply'),
              );

              const detailPanel = createElement('div', 'detail-panel');
              detailPanel.hidden = true;

              toggle.addEventListener('click', () => {
                const expanded = toggle.getAttribute('aria-expanded') === 'true';
                const nextExpanded = !expanded;
                toggle.setAttribute('aria-expanded', String(nextExpanded));
                row.classList.toggle('expanded', nextExpanded);
                detailPanel.hidden = !nextExpanded;
                if (nextExpanded) {
                  loadDeploymentDetail(deployment.name, detailPanel).catch(() => {});
                }
              });

              row.append(toggle, detailLinks, detailPanel);
              groupRows.append(row);
            });

            groupSection.append(groupHead, groupRows);
            rows.append(groupSection);
          });

          article.append(head, rows);
          return article;
        });

        root.replaceChildren(...accountNodes);
      };

      const renderOverview = (focusState = null) => {
        renderToolbar(allAccounts, currentViewState);
        const visibleAccounts = applyViewState(allAccounts, currentViewState);
        renderSummary(visibleAccounts);
        if (!allAccounts.length) {
          renderEmptyState('No accounts or deployments are loaded yet.');
          restoreToolbarFocus(focusState);
          return;
        }
        if (!visibleAccounts.length) {
          renderEmptyState('No deployments match the current filters.');
          restoreToolbarFocus(focusState);
          return;
        }
        renderAccounts(visibleAccounts);
        restoreToolbarFocus(focusState);
      };

      currentPageState = parsePageState();
      currentViewState = parseViewState();
      if (currentPageState.page === 'applications') {
        fetch('/v1/overview/applications')
          .then((response) => {
            if (!response.ok) throw new Error(`overview request failed (${response.status})`);
            return response.json();
          })
          .then((applications) => {
            allApplications = applications;
            currentViewState = normalizeViewState(applications, parseViewState());
            syncViewState(currentViewState);
            renderApplicationsOverview(applications);
          })
          .catch((error) => {
            renderEmptyState(`Failed to load overview: ${error.message}`);
          });
      } else {
        if (!currentPageState.deployment) {
          renderEmptyState('deployment page is missing a deployment query parameter');
        } else {
          fetchDeploymentDetail(currentPageState.deployment)
            .then((detail) => {
              if (currentPageState.page === 'application') {
                renderApplicationDetailPage(detail);
                return;
              }
              if (currentPageState.page === 'resource') {
                renderResourceDetailPage(detail);
                return;
              }
              if (currentPageState.page === 'drift' || currentPageState.page === 'plan') {
                renderDeploymentWorkspace(currentPageState.page, detail);
                return;
              }
              throw new Error(`unsupported page ${currentPageState.page}`);
            })
            .catch((error) => {
              renderEmptyState(`Failed to load overview: ${error.message}`);
            });
        }
      }
    </script>
  </body>
</html>
