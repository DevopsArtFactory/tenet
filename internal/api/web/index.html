<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tenet Control Plane</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07111f;
        --panel: rgba(11, 24, 43, 0.9);
        --panel-2: rgba(21, 37, 63, 0.88);
        --line: rgba(120, 160, 255, 0.16);
        --text: #ebf2ff;
        --muted: #94a8c7;
        --green: #45d483;
        --yellow: #f4c95d;
        --blue: #67b7ff;
        --red: #ff7b7b;
        --purple: #a78bfa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: radial-gradient(circle at top, #12305f 0%, var(--bg) 45%, #030814 100%);
        color: var(--text);
      }
      .shell { max-width: 1280px; margin: 0 auto; padding: 32px 20px 56px; }
      .hero { display: flex; justify-content: space-between; gap: 16px; align-items: end; margin-bottom: 24px; }
      .title { font-size: 36px; font-weight: 800; letter-spacing: -0.04em; margin: 0 0 8px; }
      .subtitle { margin: 0; color: var(--muted); max-width: 720px; line-height: 1.5; }
      .toolbar { display:grid; gap: 16px; margin-bottom: 24px; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 18px 40px rgba(0,0,0,0.24); }
      .toolbar-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
      .toolbar-field { display:grid; gap: 8px; }
      .toolbar-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
      .toolbar-input, .toolbar-select { width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); color: var(--text); padding: 12px 14px; font: inherit; }
      .toolbar-input::placeholder { color: rgba(148,168,199,.72); }
      .toolbar-input:focus, .toolbar-select:focus, .toolbar-button:focus-visible { outline: 2px solid rgba(103,183,255,.45); outline-offset: 2px; }
      .toolbar-actions { display:flex; flex-wrap:wrap; gap: 10px; align-items:center; justify-content:space-between; }
      .toolbar-active { color: var(--muted); font-size: 14px; }
      .toolbar-button { border: 1px solid rgba(103,183,255,.24); background: rgba(103,183,255,.12); color: var(--blue); border-radius: 999px; padding: 10px 14px; font: inherit; font-weight: 700; cursor: pointer; }
      .toolbar-button:hover { background: rgba(103,183,255,.18); }
      .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
      .card, .account { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 18px 40px rgba(0,0,0,0.24); }
      .card { padding: 18px; }
      .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
      .value { font-size: 28px; font-weight: 800; margin-top: 8px; }
      .accounts { display: grid; gap: 20px; }
      .account { padding: 20px; }
      .account-head { display:flex; justify-content:space-between; gap:16px; align-items:start; margin-bottom: 16px; }
      .account-name { margin:0; font-size: 24px; }
      .account-meta { color: var(--muted); font-size: 14px; margin-top: 6px; }
      .rows { display:grid; gap: 16px; }
      .deployment-group { display:grid; gap: 12px; }
      .deployment-group-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; padding: 0 4px; }
      .deployment-group-title { margin:0; font-size: 16px; }
      .deployment-group-meta, .account-topology { color: var(--muted); font-size: 13px; margin-top: 6px; }
      .group-pill { padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid rgba(103,183,255,.24); color: var(--blue); background: rgba(103,183,255,.08); }
      .group-rows { display:grid; gap: 12px; }
      .row { background: var(--panel-2); border: 1px solid rgba(255,255,255,.06); border-radius: 16px; display:grid; gap: 14px; overflow: clip; }
      .row.expanded { border-color: rgba(103,183,255,.28); box-shadow: inset 0 0 0 1px rgba(103,183,255,.12); }
      .row-toggle { width: 100%; border: 0; background: transparent; color: inherit; padding: 16px; display:grid; gap: 14px; text-align: left; cursor: pointer; }
      .row-toggle:hover, .row-toggle:focus-visible { background: rgba(255,255,255,.03); }
      .row-toggle:focus-visible { outline: 2px solid rgba(103,183,255,.45); outline-offset: -2px; }
      .row-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
      .row-title { margin:0; font-size: 18px; }
      .row-subtitle { margin-top:6px; color: var(--muted); font-size: 14px; }
      .row-links { display:flex; flex-wrap:wrap; gap: 10px; margin-top: 10px; }
      .account-links { margin-top: 0; align-self: center; }
      .row-links-shell { padding: 0 16px 16px; }
      .row-link { color: var(--blue); font-size: 13px; font-weight: 600; text-decoration: none; }
      .row-link:hover, .row-link:focus-visible { text-decoration: underline; }
      .row-hint { margin-top: 10px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
      .pills { display:flex; flex-wrap:wrap; gap:8px; }
      .pill { padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
      .pill.target { background: rgba(103,183,255,.12); color: var(--blue); border-color: rgba(103,183,255,.24); }
      .pill.strategy { background: rgba(167,139,250,.12); color: var(--purple); border-color: rgba(167,139,250,.28); }
      .pill.mode { background: rgba(244,201,93,.12); color: var(--yellow); border-color: rgba(244,201,93,.28); }
      .pill.synced { background: rgba(69,212,131,.12); color: var(--green); border-color: rgba(69,212,131,.24); }
      .pill.progress { background: rgba(244,201,93,.12); color: var(--yellow); border-color: rgba(244,201,93,.28); }
      .pill.paused { background: rgba(148,168,199,.12); color: var(--muted); border-color: rgba(148,168,199,.24); }
      .pill.error { background: rgba(255,123,123,.12); color: var(--red); border-color: rgba(255,123,123,.24); }
      .metrics { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
      .metric { padding: 12px; border-radius: 14px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05); }
      .metric .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
      .metric .v { margin-top: 8px; font-size: 14px; font-weight: 650; word-break: break-word; }
      .metric.summary { grid-column: 1 / -1; }
      .detail-panel { padding: 0 16px 16px; display:grid; gap: 12px; }
      .detail-state { padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,.06); background: rgba(255,255,255,.03); color: var(--muted); }
      .detail-state.error { border-color: rgba(255,123,123,.28); color: #ffd0d0; }
      .detail-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
      .detail-section { padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,.05); background: rgba(255,255,255,.03); }
      .detail-section h4 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
      .detail-list { margin: 0; padding-left: 18px; display:grid; gap: 8px; }
      .detail-list li::marker { color: var(--blue); }
      .detail-step-meta, .detail-condition-meta { display:block; margin-top: 4px; color: var(--muted); font-size: 13px; }
      .detail-step-meta-completed { color: var(--green); }
      .detail-step-meta-current { color: var(--blue); }
      .detail-step-meta-pending { color: var(--muted); }
      .detail-execution-meta, .detail-history-meta { display:grid; gap: 4px; margin-top: 6px; }
      .detail-section-copy { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.5; }
      .drift-table-wrap { overflow-x: auto; }
      .drift-table { width: 100%; border-collapse: collapse; }
      .drift-table th, .drift-table td { text-align: left; padding: 12px 10px; border-top: 1px solid rgba(255,255,255,.06); vertical-align: top; font-size: 14px; }
      .drift-table th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; border-top: 0; }
      .drift-field { font-weight: 700; }
      .workspace-callout { display:grid; gap: 10px; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,.06); background: rgba(255,255,255,.03); }
      .workspace-callout-head { display:flex; flex-wrap:wrap; align-items:center; gap: 10px; }
      .workspace-callout-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
      .workspace-callout-copy { color: var(--text); line-height: 1.5; }
      .workspace-callout-factors { color: var(--muted); font-size: 13px; line-height: 1.5; }
      .severity-indicator { display: inline-flex; align-items: center; justify-content: center; min-width: 64px; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; border: 1px solid transparent; }
      .severity-indicator-high { background: rgba(255,123,123,.12); color: var(--red); border-color: rgba(255,123,123,.24); }
      .severity-indicator-medium { background: rgba(244,201,93,.12); color: var(--yellow); border-color: rgba(244,201,93,.28); }
      .severity-indicator-low { background: rgba(103,183,255,.12); color: var(--blue); border-color: rgba(103,183,255,.24); }
      .empty, .loading { padding: 32px; text-align:center; color: var(--muted); background: var(--panel); border:1px solid var(--line); border-radius:20px; }
      @media (max-width: 720px) {
        .hero, .row-top, .account-head { flex-direction: column; align-items: stretch; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="hero">
        <div>
          <h1 class="title">Tenet Control Plane</h1>
          <p class="subtitle">Account-oriented rollout visibility for EC2 binaries and ECS images, with strategy-aware step labels such as ShiftTrafficCanary and CreateCodeDeployDeployment for weighted-target-group and ECS CodeDeploy rollouts.</p>
        </div>
      </div>
      <section class="toolbar" id="toolbar"></section>
      <section class="summary" id="summary"></section>
      <section id="accounts" class="accounts">
        <div class="loading">Loading deployment overview…</div>
      </section>
    </div>
    <script>
      const detailStateByDeployment = new Map();
      const deploymentEventsStateByDeployment = new Map();
      const resourceLogStateByKey = new Map();
      let allAccounts = [];
      let allApplications = [];
      let currentViewState = { query: '', syncState: 'all', account: 'all' };
      let currentPageState = {
        page: 'applications',
        accountId: '',
        deployment: '',
        planId: '',
        applyId: '',
        resourceType: '',
        resourceId: '',
        auditAction: '',
        auditLimit: 0,
      };
      const auditActionOptions = [
        { value: '', label: 'All actions' },
        { value: 'plan.created', label: 'plan.created' },
        { value: 'apply.requested', label: 'apply.requested' },
      ];
      const validAuditActions = new Set(auditActionOptions.map((option) => option.value).filter(Boolean));

      const statusClass = (state) => {
        switch (state) {
          case 'Synced':
            return 'synced';
          case 'Reconciling':
          case 'OutOfSync':
          case 'Drifted':
            return 'progress';
          case 'Paused':
            return 'paused';
          case 'Error':
            return 'error';
          default:
            return '';
        }
      };
      const healthClass = (overall) => {
        switch (overall) {
          case 'Healthy':
            return 'synced';
          case 'Progressing':
            return 'progress';
          case 'Unhealthy':
            return 'error';
          default:
            return '';
        }
      };

      const healthLabel = (health) => health?.overall || 'Unknown';
      const artifact = (obj) => obj?.binary || obj?.image || '—';
      const boolLabel = (value) => value ? 'True' : 'False';
      const textOrDash = (value) => value || '—';
      const runtimeSummaryTimestamp = (runtimeSummary) => runtimeSummary?.timestamp || 'Latest runtime status';
      const rolloutContextText = (value) => {
        const parts = [
          value?.targetType ? `Target ${value.targetType}` : '',
          value?.strategy ? `Strategy ${value.strategy}` : '',
          value?.executionMode ? `Execution ${value.executionMode}` : '',
        ].filter(Boolean);
        return parts.length ? parts.join(' · ') : '';
      };
      const runtimeArtifactText = (artifactValue) => {
        const value = artifact(artifactValue);
        return value === '—' ? '' : value;
      };
      const runtimeConditionSummary = (condition) => {
        const type = typeof condition?.type === 'string' ? condition.type : '';
        const statusText = typeof condition?.status === 'boolean' ? boolLabel(condition.status) : '';
        const identity = [type, statusText ? ` = ${statusText}` : ''].join('');
        const parts = [identity, typeof condition?.reason === 'string' ? condition.reason : ''].filter(Boolean);
        return parts.join(' · ');
      };
      const runtimeConditionsText = (conditions, emptyValue = '—') => {
        const labels = (conditions || []).map((condition) => runtimeConditionSummary(condition)).filter(Boolean);
        return labels.length ? labels.join('; ') : emptyValue;
      };
      const runtimeSummaryText = (runtimeSummary) => {
        if (!runtimeSummary) return '—';
        const labels = changeLabels(runtimeSummary?.changes);
        const changeDetails = changeDetailLabels(runtimeSummary?.changeDetails);
        const runtimeContext = rolloutContextText(runtimeSummary);
        const parts = [
          runtimeSummary.summary,
          runtimeSummary.sync?.state,
          runtimeSummary.sync?.reason,
          runtimeSummary.health?.overall,
          runtimeSummary.health?.summary,
          runtimeContext,
          runtimeArtifactText(runtimeSummary.deployedArtifact),
          runtimeConditionsText(runtimeSummary.conditions, ''),
          runtimeSummary.source,
          labels.length ? labels.join(', ') : '',
          changeDetails.length ? changeDetails.join('; ') : '',
          runtimeSummary.rolloutPhase,
          runtimeSummary.currentStep,
          Number.isFinite(runtimeSummary.historyCount) ? `history ${runtimeSummary.historyCount}` : '',
        ].filter(Boolean);
        return parts.length ? parts.join(' · ') : '—';
      };
      const plannedSteps = (rollout) => {
        const steps = (rollout?.steps || []).map((step) => step.kind).filter(Boolean);
        return steps.length ? steps.join(' → ') : '—';
      };
      const metricValue = (value) => value ?? '—';
      const generationValue = (value) => Number.isFinite(value) && value > 0 ? String(value) : '—';
      const generationsText = (value) => {
        const desired = generationValue(value?.desiredGeneration);
        const observed = generationValue(value?.observedGeneration);
        return `desired ${desired} · observed ${observed}`;
      };
      const changeLabels = (changes) => (changes || []).filter((change) => typeof change === 'string' && change);
      const changeLabelsText = (changes) => {
        const labels = changeLabels(changes);
        return labels.length ? labels.join(', ') : '—';
      };
      const changeDetailLabels = (changeDetails) => (changeDetails || []).filter((detail) => typeof detail === 'string' && detail);
      const changeDetailsText = (changeDetails) => {
        const labels = changeDetailLabels(changeDetails);
        return labels.length ? labels.join('; ') : '—';
      };
      const driftSeverityRank = (severity) => {
        switch (severity) {
          case 'high':
            return 3;
          case 'medium':
            return 2;
          case 'low':
            return 1;
          default:
            return 0;
        }
      };
      const deriveDeploymentDriftRows = (detail) => {
        const rows = [];
        const desiredArtifact = artifact(detail.desiredArtifact);
        const actualArtifact = artifact(detail.deployedArtifact) !== '—' ? artifact(detail.deployedArtifact) : runtimeArtifactText(detail.runtimeSummary?.deployedArtifact) || '—';
        if (desiredArtifact !== '—' && actualArtifact !== '—' && desiredArtifact !== actualArtifact) {
          rows.push({
            field: 'artifact',
            desired: desiredArtifact,
            actual: actualArtifact,
            severity: 'high',
            search: [desiredArtifact, actualArtifact, detail.sync?.reason].filter(Boolean).join(' '),
          });
        }

        const desiredGeneration = Number.isFinite(detail.desiredGeneration) ? detail.desiredGeneration : detail.runtimeSummary?.desiredGeneration;
        const observedGeneration = Number.isFinite(detail.runtimeSummary?.observedGeneration) ? detail.runtimeSummary.observedGeneration : detail.observedGeneration;
        if (Number.isFinite(desiredGeneration) && Number.isFinite(observedGeneration) && desiredGeneration !== observedGeneration) {
          rows.push({
            field: 'generation',
            desired: String(desiredGeneration),
            actual: String(observedGeneration),
            severity: 'medium',
            search: [detail.sync?.reason, detail.runtimeSummary?.summary].filter(Boolean).join(' '),
          });
        }

        const runtimeContextSearch = [detail.sync?.reason, detail.runtimeSummary?.source, detail.runtimeSummary?.summary].filter(Boolean).join(' ');
        if (detail.targetType && detail.runtimeSummary?.targetType && detail.targetType !== detail.runtimeSummary.targetType) {
          rows.push({
            field: 'runtimeContext.targetType',
            desired: detail.targetType,
            actual: detail.runtimeSummary.targetType,
            severity: 'medium',
            search: runtimeContextSearch,
          });
        }
        if (detail.strategy && detail.runtimeSummary?.strategy && detail.strategy !== detail.runtimeSummary.strategy) {
          rows.push({
            field: 'runtimeContext.strategy',
            desired: detail.strategy,
            actual: detail.runtimeSummary.strategy,
            severity: 'medium',
            search: runtimeContextSearch,
          });
        }
        if (detail.executionMode && detail.runtimeSummary?.executionMode && detail.executionMode !== detail.runtimeSummary.executionMode) {
          rows.push({
            field: 'runtimeContext.executionMode',
            desired: detail.executionMode,
            actual: detail.runtimeSummary.executionMode,
            severity: 'medium',
            search: runtimeContextSearch,
          });
        }

        (detail.conditions || []).forEach((condition) => {
          const type = textOrDash(condition.type);
          const statusText = typeof condition.status === 'boolean' ? boolLabel(condition.status) : 'Unknown';
          const desired = type === 'Healthy' ? 'True' : 'False';
          const actual = [statusText, condition.reason, condition.message].filter(Boolean).join(' · ');
          const severity = condition.type === 'Healthy' ? 'low' : 'high';
          const driftCondition = condition.type === 'DriftDetected' && condition.status === true;
          const unhealthyCondition = condition.type === 'Healthy' && condition.status === false;
          if (driftCondition || unhealthyCondition) {
            rows.push({
              field: `condition.${condition.type || 'Unknown'}`,
              desired,
              actual,
              severity,
              search: [condition.type, condition.reason, condition.message].filter(Boolean).join(' '),
            });
          }
        });

        return rows;
      };
      const rolloutPhaseForStepKind = (stepKind) => {
        switch (stepKind) {
          case 'CreateCandidateCapacity':
          case 'StartInstanceRefresh':
          case 'CreateCodeDeployDeployment':
          case 'UpdateECSService':
            return 'Provisioning';
          case 'VerifyCandidateCapacity':
            return 'Health checking';
          case 'ShiftTrafficCanary':
          case 'ShiftTrafficLinear':
          case 'ShiftTrafficFull':
          case 'PromoteCandidateCapacity':
            return 'Promoting';
          case 'VerifyReplacementCapacity':
          case 'VerifyServiceStability':
            return 'Stabilizing';
          case 'MarkSynced':
            return 'Completed';
          default:
            return 'Accepted';
        }
      };
      const effectiveRolloutContext = (detail) => ({
        targetType: detail.runtimeSummary?.targetType || detail.targetType || '',
        strategy: detail.runtimeSummary?.strategy || detail.strategy || '',
        executionMode: detail.runtimeSummary?.executionMode || detail.executionMode || '',
      });
      const stepTargetResourceTypes = (stepKind, detail) => {
        const context = effectiveRolloutContext(detail);
        switch (stepKind) {
          case 'CreateCandidateCapacity':
          case 'VerifyCandidateCapacity':
          case 'PromoteCandidateCapacity':
            return ['candidateAutoScalingGroup', 'serviceAutoScalingGroup'];
          case 'ShiftTrafficCanary':
          case 'ShiftTrafficLinear':
          case 'ShiftTrafficFull':
            if (context.executionMode === 'ecsCodeDeploy') return ['codeDeployDeploymentGroup', 'productionListener', 'testListener'];
            return ['trafficShiftPlan', 'productionListenerRule', 'activeTargetGroup', 'candidateTargetGroup'];
          case 'StartInstanceRefresh':
          case 'VerifyReplacementCapacity':
            return ['serviceAutoScalingGroup'];
          case 'UpdateECSService':
          case 'VerifyServiceStability':
            return ['ecsService', 'codeDeployDeploymentGroup'];
          case 'CreateCodeDeployDeployment':
            return ['codeDeployDeploymentGroup', 'codeDeployApplication'];
          default:
            return [];
        }
      };
      const derivePlanOperationTarget = (detail, stepKind, executionResources) => {
        const preferredTypes = stepTargetResourceTypes(stepKind, detail);
        const match = executionResources.find((resource) => preferredTypes.includes(resource.type));
        if (match) return `${match.name} (${match.type})`;
        switch (stepKind) {
          case 'MarkSynced':
            return `${detail.name} deployment read model`;
          default:
            return `${detail.name} deployment`;
        }
      };
      const derivePlanOperationSummary = (detail, step) => {
        const context = effectiveRolloutContext(detail);
        if (step.detail) return step.detail;
        switch (step.kind) {
          case 'CreateCandidateCapacity':
            return 'Prepare fresh candidate EC2 capacity before traffic shifting.';
          case 'VerifyCandidateCapacity':
            return 'Confirm the candidate EC2 capacity is healthy enough for live traffic.';
          case 'ShiftTrafficCanary':
            return context.executionMode === 'ecsCodeDeploy'
              ? 'Shift a small live ECS traffic slice through CodeDeploy before wider promotion.'
              : 'Shift a small live EC2 traffic slice through weighted target groups before wider promotion.';
          case 'ShiftTrafficLinear':
            return context.executionMode === 'ecsCodeDeploy'
              ? 'Advance ECS traffic in controller-defined CodeDeploy increments.'
              : 'Advance EC2 traffic in controller-defined weighted target-group increments.';
          case 'ShiftTrafficFull':
            return context.executionMode === 'ecsCodeDeploy'
              ? 'Cut all ECS traffic to the replacement task set in one promotion step.'
              : 'Cut all EC2 traffic to the candidate target group in one promotion step.';
          case 'PromoteCandidateCapacity':
            return 'Promote the candidate EC2 capacity to become the steady-state fleet.';
          case 'StartInstanceRefresh':
            return 'Start the EC2 instance refresh against the existing service Auto Scaling Group.';
          case 'VerifyReplacementCapacity':
            return 'Confirm refreshed EC2 instances are ready before the rollout is considered stable.';
          case 'UpdateECSService':
            return 'Update the ECS service to create the replacement deployment.';
          case 'CreateCodeDeployDeployment':
            return 'Create the CodeDeploy deployment Tenet will use for traffic shifting.';
          case 'VerifyServiceStability':
            return context.executionMode === 'ecsCodeDeploy'
              ? 'Confirm the ECS service stays healthy after the CodeDeploy traffic shift.'
              : 'Confirm the ECS service stays healthy after the rolling update.';
          case 'MarkSynced':
            return 'No further rollout mutation is implied by the current read model.';
          default:
            return 'Await the next controller-authored rollout detail.';
        }
      };
      const derivePlanOperations = (detail) => {
        const steps = detail.rollout?.steps || [];
        const executionResources = rolloutExecutionResources(detail).map((resource) => normalizeResource(resource));
        return steps.map((step, index) => {
          const status = rolloutStepStatus(step, index, steps);
          return {
            kind: textOrDash(step.kind),
            status,
            statusLabel: rolloutStepStatusLabel(status),
            phase: rolloutPhaseForStepKind(step.kind),
            target: derivePlanOperationTarget(detail, step.kind, executionResources),
            summary: derivePlanOperationSummary(detail, step),
          };
        });
      };
      const derivePlanRisk = (detail) => {
        const driftRows = deriveDeploymentDriftRows(detail);
        const reasons = [];
        const currentStep = detail.rollout?.currentStep || detail.runtimeSummary?.currentStep || '';
        const hasHighDrift = driftRows.some((row) => row.severity === 'high');
        const hasMediumDrift = driftRows.some((row) => row.severity === 'medium');
        const activeTrafficShift = currentStep.startsWith('ShiftTraffic') || currentStep === 'PromoteCandidateCapacity';
        const unhealthy = detail.health?.overall === 'Unhealthy';
        const errorState = detail.sync?.state === 'Error';

        let level = 'low';

        const synced = deployments.filter((deployment) => deployment.sync?.state === 'Synced').length;
        const progressingStates = new Set(['Reconciling', 'OutOfSync', 'Drifted']);
        const progressing = deployments.filter((deployment) => progressingStates.has(deployment.sync?.state)).length;
        const paused = deployments.filter((deployment) => deployment.sync?.state === 'Paused').length;
        const errored = deployments.filter((deployment) => deployment.sync?.state === 'Error').length;
        const summary = document.getElementById('summary');
        summary.replaceChildren(...[
          ['Accounts', accounts.length],
          ['Deployments', deployments.length],
          ['Synced', synced],
          ['Progressing', progressing],
          ['Paused', paused],
          ['Error', errored],
        ].map(([label, value]) => {
          const card = createElement('div', 'card');
          card.append(
            createElement('div', 'label', String(label)),
            createElement('div', 'value', String(value)),
          );
          return card;
        }));
      };

      const createAccountOverviewArticle = (account) => {
          const article = createElement('article', 'account');
          const head = createElement('div', 'account-head');
          const titleWrap = createElement('div');
          const derivedTopology = deriveProjectEnvironmentGroups(account);
          const topology = {
            projectCount: account.projectCount ?? derivedTopology.projectCount,
            environmentCount: account.environmentCount ?? derivedTopology.environmentCount,
            groups: derivedTopology.groups,
          };
          titleWrap.append(
            createElement('h2', 'account-name', account.name || 'Unknown account'),
            createElement('div', 'account-meta', `AWS account ${metricValue(account.awsAccountId)} · Regions: ${(account.allowedRegions || []).join(', ') || '—'}`),
            createElement('div', 'account-topology', `${topology.projectCount} projects · ${topology.environmentCount} environments`),
          );
          const accountLinks = createElement('div', 'row-links');
          accountLinks.classList.add('account-links');
          if (account.awsAccountId) {
            accountLinks.append(createNavLink(`/v1/overview/accounts/${encodeURIComponent(account.awsAccountId)}`, 'Account JSON'));
          }
          const pills = createElement('div', 'pills');
          const fallbackCounts = deriveAccountCounts(account);
          const accountCountPills = [
            [account.deploymentCount ?? fallbackCounts.deploymentCount, 'deployments', 'pill target'],
            [account.syncedCount ?? fallbackCounts.syncedCount, 'synced', 'pill synced'],
            [account.progressingCount ?? fallbackCounts.progressingCount, 'progressing', 'pill progress'],
            [account.pausedCount ?? fallbackCounts.pausedCount, 'paused', 'pill paused'],
            [account.errorCount ?? fallbackCounts.errorCount, 'error', 'pill error'],
          ];
          accountCountPills.forEach(([value, label, className]) => {
            pills.append(createElement('span', className, `${value} ${label}`));
          });
          head.append(titleWrap, accountLinks, pills);

          const rows = createElement('div', 'rows');
          topology.groups.forEach((group) => {
            const groupSection = createElement('section', 'deployment-group');
            const groupHead = createElement('div', 'deployment-group-head');
            const groupTitleWrap = createElement('div');
            groupTitleWrap.append(
              createElement('h3', 'deployment-group-title', `${metricValue(group.appRef)} · ${metricValue(group.environmentRef)}`),
              createElement('div', 'deployment-group-meta', `Project ${metricValue(group.appRef)} · Environment ${metricValue(group.environmentRef)} · Region ${metricValue(group.region)}`),
            );
            const groupLinks = createElement('div', 'row-links');
            groupLinks.classList.add('group-links');
            if (account.awsAccountId && group.appRef && group.environmentRef) {
              groupLinks.append(createNavLink(`/v1/overview/accounts/${encodeURIComponent(account.awsAccountId)}/projects/${encodeURIComponent(group.appRef)}/environments/${encodeURIComponent(group.environmentRef)}`, 'Group JSON'));
            }
            const groupPills = createElement('div', 'pills');
            const groupCount = group.deployments.length;
            groupPills.append(createElement('span', 'group-pill', `${groupCount} deployment${groupCount === 1 ? '' : 's'}`));
            const groupCounts = deriveGroupCounts(group);
            [
              [groupCounts.syncedCount, 'synced', 'pill synced'],
              [groupCounts.progressingCount, 'progressing', 'pill progress'],
              [groupCounts.pausedCount, 'paused', 'pill paused'],
              [groupCounts.errorCount, 'error', 'pill error'],
            ].forEach(([value, label, className]) => {
              if (value > 0) {
                groupPills.append(createElement('span', className, `${value} ${label}`));
              }
            });
            groupHead.append(groupTitleWrap, groupLinks, groupPills);

            const groupRows = createElement('div', 'group-rows');
            group.deployments.forEach((deployment) => {
              const row = createElement('div', 'row');
              const toggle = createElement('div', 'row-toggle');
              toggle.tabIndex = 0;
              toggle.setAttribute('role', 'button');
              toggle.setAttribute('aria-expanded', 'false');
              toggle.setAttribute('aria-label', `Expand details for ${deployment.name || 'deployment'}`);
              const rowTop = createElement('div', 'row-top');
              const rowTitleWrap = createElement('div');
              rowTitleWrap.append(
                createElement('h3', 'row-title', deployment.name || 'Unknown deployment'),
                createElement('div', 'row-subtitle', [deployment.appRef, deployment.environmentRef, deployment.region].filter(Boolean).join(' · ') || '—'),
                createElement('div', 'row-hint', 'Expand details'),
              );

              const rowPills = createElement('div', 'pills');
              [
                ['pill target', deployment.targetType || 'unknown target'],
                ['pill strategy', deployment.strategy || 'unknown strategy'],
                ['pill mode', deployment.executionMode || 'unassigned execution'],
                [`pill ${statusClass(deployment.sync?.state)}`, deployment.sync?.state || 'Unknown'],
              ].forEach(([className, text]) => {
                rowPills.append(createElement('span', className, text));
              });
              rowTop.append(rowTitleWrap, rowPills);

              const metrics = createElement('div', 'metrics');
              [
                ['Desired artifact', artifact(deployment.desiredArtifact)],
                ['Deployed artifact', artifact(deployment.deployedArtifact)],
                ['Latest runtime', runtimeSummaryText(deployment.runtimeSummary), 'summary'],
                ['Latest changes', changeLabelsText(deployment.runtimeSummary?.changes)],
                ['Runtime timestamp', runtimeSummaryTimestamp(deployment.runtimeSummary)],
                ['Runtime generations', generationsText(deployment.runtimeSummary)],
                ['Rollout phase', metricValue(deployment.rollout?.phase)],
                ['Current step', metricValue(deployment.rollout?.currentStep)],
                ['Rollout summary', metricValue(deployment.rollout?.summary), 'summary'],
                ['Planned steps', plannedSteps(deployment.rollout)],
                ['Health', `${healthLabel(deployment.health)}${deployment.health?.summary ? ` · ${deployment.health.summary}` : ''}`],
                ['Observed generation', generationValue(deployment.observedGeneration)],
              ].forEach(([label, value, className]) => {
                metrics.append(createMetric(label, value, className));
              });

              toggle.append(rowTop, metrics);

              const detailLinks = createElement('div', 'row-links row-links-shell');
              if (deployment.name) {
                detailLinks.append(
                  createNavLink(buildPageURL('application', { deployment: deployment.name }), 'Open application', '_self'),
                  createNavLink(`/v1/overview/deployments/${encodeURIComponent(deployment.name)}`, 'Overview JSON'),
                  createNavLink(`/v1/status/deployments/${encodeURIComponent(deployment.name)}`, 'Status JSON'),
                );
              }

              const detailPanel = createElement('div', 'detail-panel');
              detailPanel.hidden = true;

              const toggleExpandedState = () => {
                const expanded = toggle.getAttribute('aria-expanded') === 'true';
                const nextExpanded = !expanded;
                toggle.setAttribute('aria-expanded', String(nextExpanded));
                row.classList.toggle('expanded', nextExpanded);
                detailPanel.hidden = !nextExpanded;
                if (nextExpanded) {
                  if (!deployment.name) {
                    renderDetailState(detailPanel, 'Deployment detail is unavailable because this row is missing a deployment name.', 'error');
                    return;
                  }
                  loadDeploymentDetail(deployment.name, detailPanel).catch(() => {});
                }
              };

              toggle.addEventListener('click', toggleExpandedState);
              toggle.addEventListener('keydown', (event) => {
                if (event.key !== 'Enter' && event.key !== ' ') {
                  return;
                }
                event.preventDefault();
                toggleExpandedState();
              });

              row.append(toggle, detailLinks, detailPanel);
              groupRows.append(row);
            });

            groupSection.append(groupHead, groupRows);
            rows.append(groupSection);
          });

          article.append(head, rows);
          return article;
      };

      const renderAccountDetailPage = (account) => {
        const toolbar = document.getElementById('toolbar');
        const summary = document.getElementById('summary');
        const root = document.getElementById('accounts');
        const backLink = createNavLink(buildPageURL('applications'), 'Back to applications');
        backLink.target = '_self';
        backLink.rel = '';
        toolbar.replaceChildren(backLink);

        const detailSummary = createElement('article', 'account');
        detailSummary.append(
          createElement('div', 'label', 'Account deployment overview'),
          createElement('h2', 'account-name', account.name || currentPageState.accountId || 'Account'),
          createElement('div', 'account-meta', `AWS account ${metricValue(account.awsAccountId)} · Regions: ${(account.allowedRegions || []).join(', ') || '—'}`),
          createElement('div', 'account-topology', `${account.projectCount ?? deriveProjectEnvironmentGroups(account).projectCount} projects · ${account.environmentCount ?? deriveProjectEnvironmentGroups(account).environmentCount} environments`),
        );
        summary.replaceChildren(detailSummary);
        root.replaceChildren(createAccountOverviewArticle(account));
      };

      const renderAccounts = (accounts) => {
        const root = document.getElementById('accounts');
        if (!accounts.length) {
          renderEmptyState('No accounts or deployments are loaded yet.');
          return;
        }

        const accountNodes = accounts.map((account) => createAccountOverviewArticle(account));

        root.replaceChildren(...accountNodes);
      };

      const renderOverview = (focusState = null) => {
        renderToolbar(allAccounts, currentViewState);
        const visibleAccounts = applyViewState(allAccounts, currentViewState);
        renderSummary(visibleAccounts);
        if (!allAccounts.length) {
          renderEmptyState('No accounts or deployments are loaded yet.');
          restoreToolbarFocus(focusState);
          return;
        }
        if (!visibleAccounts.length) {
          renderEmptyState('No deployments match the current filters.');
          restoreToolbarFocus(focusState);
          return;
        }
        renderAccounts(visibleAccounts);
        restoreToolbarFocus(focusState);
      };

      currentPageState = parsePageState();
      currentViewState = parseViewState();
      if (currentPageState.page === 'applications') {
        fetch('/v1/overview/applications')
          .then((response) => {
            if (!response.ok) throw new Error(`overview request failed (${response.status})`);
            return response.json();
          })
          .then((applications) => {
            allApplications = applications;
            currentViewState = normalizeViewState(applications, parseViewState());
            syncViewState(currentViewState);
            renderApplicationsOverview(applications);
          })
          .catch((error) => {
            renderEmptyState(`Failed to load overview: ${error.message}`);
          });
      } else if (currentPageState.page === 'audit') {
        loadAuditLogsPage();
      } else if (currentPageState.page === 'account') {
        if (!currentPageState.accountId) {
          renderEmptyState('account page is missing an accountId query parameter');
        } else {
          fetch(`/v1/overview/accounts/${encodeURIComponent(currentPageState.accountId)}`)
            .then((response) => {
              if (!response.ok) throw new Error(`overview request failed (${response.status})`);
              return response.json();
            })
            .then((account) => {
              renderAccountDetailPage(account);
            })
            .catch((error) => {
              renderEmptyState(`Failed to load overview: ${error.message}`);
            });
        }
      } else {
        if (!currentPageState.deployment) {
          renderEmptyState('deployment page is missing a deployment query parameter');
        } else {
          const applicationDetail = currentPageState.page === 'application' ? fetchApplicationDetail(currentPageState.deployment) : fetchDeploymentDetail(currentPageState.deployment);
          applicationDetail
            .then((detail) => {
              if (currentPageState.page === 'application') {
                renderApplicationDetailPage(detail);
                return;
              }
              if (currentPageState.page === 'resource') {
                renderResourceDetailPage(detail);
                return;
              }
              if (currentPageState.page === 'drift') {
                renderDeploymentWorkspace(currentPageState.page, detail);
                return;
              }
              if (currentPageState.page === 'plan') {
                let planState = {
                  status: 'idle',
                  request: 'idle',
                  planId: currentPageState.planId,
                  record: null,
                  error: null,
                };
                let applyState = {
                  status: 'idle',
                  request: 'idle',
                  applyId: currentPageState.applyId,
                  record: null,
                  error: null,
                };
                const syncPlanPageURL = (planId, applyId = '') => {
                  currentPageState = { ...currentPageState, planId: planId || '', applyId: applyId || '' };
                  const query = buildPageURL('plan', {
                    deployment: detail.name || currentPageState.deployment,
                    planId: planId || '',
                    applyId: applyId || '',
                  });
                  const hash = window.location.hash || '';
                  history.replaceState({}, '', `${query}${hash}`);
                };
                const renderPlanWorkspace = () => {
                  renderDeploymentWorkspace('plan', detail, {
                    ...planState,
                    onCreatePlan: async () => {
                      const fallbackIfMatch = planState.record?.source?.fingerprint || '';
                      planState = {
                        ...planState,
                        status: 'loading',
                        request: 'create',
                        record: null,
                        error: null,
                      };
                      applyState = {
                        ...applyState,
                        status: 'idle',
                        request: 'idle',
                        applyId: '',
                        record: null,
                        error: null,
                      };
                      renderPlanWorkspace();
                      const ifMatch = detail.sourceFingerprint || await derivePlanSourceFingerprint(detail).catch(() => '') || fallbackIfMatch;
                      createPlanPreview(detail.name || currentPageState.deployment, ifMatch)
                        .then((record) => {
                          planState = {
                            ...planState,
                            status: record.status === 'failed' ? 'failed' : 'ready',
                            request: 'create',
                            planId: record.id,
                            record,
                            error: null,
                          };
                          syncPlanPageURL(record.id, '');
                          renderPlanWorkspace();
                        })
                        .catch((error) => {
                          planState = {
                            ...planState,
                            status: error.kind === 'unavailable' ? 'unavailable' : 'fetch-error',
                            request: 'create',
                            error,
                          };
                          renderPlanWorkspace();
                        });
                    },
                  }, {
                    ...applyState,
                    onApplyPlan: async () => {
                      const planID = planState.record?.id || planState.planId || '';
                      if (!planID || !planPreviewCanApply(planState)) return;
                      applyState = {
                        ...applyState,
                        status: 'loading',
                        request: 'create',
                        applyId: '',
                        record: null,
                        error: null,
                      };
                      renderPlanWorkspace();
                      createApplyRequest(planID)
                        .then((record) => {
                          if (record.deploymentName && detail.name && record.deploymentName !== detail.name) {
                            throw requestError('fetch-error', `apply request ${record.id} belongs to ${record.deploymentName}, not ${detail.name}`);
                          }
                          if (record.planId && planState.record?.id && record.planId !== planState.record.id) {
                            throw requestError('fetch-error', `apply request ${record.id} belongs to plan ${record.planId}, not ${planState.record.id}`);
                          }
                          applyState = {
                            ...applyState,
                            status: record.status === 'failed' ? 'failed' : 'ready',
                            request: 'create',
                            applyId: record.id,
                            record,
                            error: null,
                          };
                          syncPlanPageURL(record.planId || planID, record.id);
                          renderPlanWorkspace();
                        })
                        .catch((error) => {
                          applyState = {
                            ...applyState,
                            status: error.kind === 'unavailable' ? 'unavailable' : 'fetch-error',
                            request: 'create',
                            error,
                          };
                          renderPlanWorkspace();
                        });
                    },
                  });
                };

                renderPlanWorkspace();
                if (currentPageState.planId) {
                  planState = {
                    ...planState,
                    status: 'loading',
                    request: 'load',
                    planId: currentPageState.planId,
                    error: null,
                  };
                  renderPlanWorkspace();
                  fetchPlanPreview(currentPageState.planId)
                    .then((record) => {
                      if (record.deploymentName && detail.name && record.deploymentName !== detail.name) {
                        throw requestError('fetch-error', `plan preview ${record.id} belongs to ${record.deploymentName}, not ${detail.name}`);
                      }
                      planState = {
                        ...planState,
                        status: record.status === 'failed' ? 'failed' : 'ready',
                        request: 'load',
                        planId: record.id,
                        record,
                        error: null,
                      };
                      syncPlanPageURL(record.id, currentPageState.applyId || applyState.applyId || '');
                      renderPlanWorkspace();
                    })
                    .catch((error) => {
                      planState = {
                        ...planState,
                        status: error.kind === 'unavailable' ? 'unavailable' : 'fetch-error',
                        request: 'load',
                        error,
                      };
                      renderPlanWorkspace();
                    });
                }
                if (currentPageState.applyId) {
                  applyState = {
                    ...applyState,
                    status: 'loading',
                    request: 'load',
                    applyId: currentPageState.applyId,
                    error: null,
                  };
                  renderPlanWorkspace();
                  fetchApplyRequest(currentPageState.applyId)
                    .then((record) => {
                      if (record.deploymentName && detail.name && record.deploymentName !== detail.name) {
                        throw requestError('fetch-error', `apply request ${record.id} belongs to ${record.deploymentName}, not ${detail.name}`);
                      }
                      if (currentPageState.planId && record.planId && record.planId !== currentPageState.planId) {
                        throw requestError('fetch-error', `apply request ${record.id} belongs to plan ${record.planId}, not ${currentPageState.planId}`);
                      }
                      applyState = {
                        ...applyState,
                        status: record.status === 'failed' ? 'failed' : 'ready',
                        request: 'load',
                        applyId: record.id,
                        record,
                        error: null,
                      };
                      syncPlanPageURL(record.planId || currentPageState.planId, record.id);
                      renderPlanWorkspace();
                    })
                    .catch((error) => {
                      applyState = {
                        ...applyState,
                        status: error.kind === 'unavailable' ? 'unavailable' : 'fetch-error',
                        request: 'load',
                        error,
                      };
                      renderPlanWorkspace();
                    });
                }
                return;
              }
              throw new Error(`unsupported page ${currentPageState.page}`);
            })
            .catch((error) => {
              renderEmptyState(`Failed to load overview: ${error.message}`);
            });
        }
      }
    </script>
  </body>
</html>
