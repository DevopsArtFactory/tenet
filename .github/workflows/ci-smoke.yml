name: CI Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-smoke:
    name: Fast smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Syntax-check local smoke script
        run: bash -n scripts/smoke-local.sh

      - name: Syntax-check docker smoke script
        run: bash -n scripts/smoke-docker.sh

      - name: Run local smoke test
        run: make smoke-local

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Syntax-check docker smoke script
        run: bash -n scripts/smoke-docker.sh

      - name: Run docker smoke test
        run: make smoke-docker
