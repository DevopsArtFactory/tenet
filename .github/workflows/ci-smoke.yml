name: CI Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-smoke:
    name: Fast smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Syntax-check local smoke script
        run: bash -n scripts/smoke-local.sh

      - name: Syntax-check docker smoke script
        run: bash -n scripts/smoke-docker.sh

      - name: Syntax-check runner evidence helper
        run: bash -n scripts/ci-smoke-runner-evidence.sh

      - name: Run local smoke test
        run: make smoke-local

  ecs-fixture-validation:
    name: ECS fixture validation (no AWS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate sandbox fixture with mocked AWS provider
        working-directory: deploy/terraform/ecs-native-integration
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform fmt -check -recursive
          terraform validate -no-color
          terraform test -no-color

      - name: Test offline export, evidence collector and test app
        run: python3 -m unittest discover -s tests/ecs-native-integration -v

  ecs-emulator:
    name: Native ECS rollback (AWS Emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify the AWS Emulator LTS package
        working-directory: ${{ runner.temp }}
        run: |
          url=https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator_amd64.deb
          curl -fsSL --retry 3 "$url" -o emulator.deb
          curl -fsSL --retry 3 "$url.sig" -o emulator.deb.sig
          curl -fsSL --retry 3 https://downloads.aws.com/keys/gpg/current.asc -o aws.asc
          gpg --batch --dearmor --output publisher.gpg aws.asc
          gpgv --keyring "$PWD/publisher.gpg" --status-fd 1 emulator.deb.sig emulator.deb > verification.txt
          # VALIDSIG ends with the primary signing key fingerprint.
          awk '$2 == "VALIDSIG" && $NF == "98BCF336A3BE53B734E967C52E5BF49BD940F624" {ok=1} END {exit !ok}' verification.txt
          dpkg-deb -f emulator.deb Version
          dpkg-deb -x emulator.deb emulator

      - name: Deploy, roll back and restore capacity for all native strategies
        env:
          TENET_EMULATOR_STATE: ${{ runner.temp }}/ecs-home/.aws/emulator/19297
        run: |
          mkdir -p "$RUNNER_TEMP/ecs-home"
          HOME="$RUNNER_TEMP/ecs-home" "$RUNNER_TEMP/emulator/opt/aws-emulator/bin/aws-emulator" -b 127.0.0.1 -p 19297 --telemetry off &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            kill -0 "$pid"
            if test -s "$TENET_EMULATOR_STATE/emulator_credentials" && curl --silent --noproxy '*' --max-time 1 --cacert "$TENET_EMULATOR_STATE/ca.pem" https://127.0.0.1:19297/ -o /dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              echo "AWS Emulator did not become ready on loopback" >&2
              exit 1
            fi
            sleep 1
          done
          go test -tags awsemulator -run '^TestNativeEmulator' -count=1 -v ./internal/ecsexecution

  docker-smoke-scope:
    name: Docker smoke scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-run: ${{ steps.scope.outputs.should-run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether Docker smoke is required
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" || ("$EVENT_NAME" == "push" && "$REF" == "refs/heads/main") ]]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "Docker smoke required for $EVENT_NAME on $REF."
            exit 0
          fi

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "Docker smoke skipped for unsupported event $EVENT_NAME."
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee /tmp/tenet-docker-smoke-changed-files.txt
          should_run=false
          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/workflows/ci-smoke.yml|\
              Makefile|\
              Dockerfile|\
              compose.yaml|\
              scripts/smoke-docker.sh|\
              scripts/docker-up.sh|\
              examples/local-repo/*|examples/local-repo/**|\
              examples/local-status/*|examples/local-status/**|\
              cmd/tenet-api/*|cmd/tenet-api/**|\
              cmd/tenet-controller/*|cmd/tenet-controller/**|\
              internal/api/*|internal/api/**|\
              internal/catalog/*|internal/catalog/**|\
              internal/domain/*|internal/domain/**|\
              internal/placement/*|internal/placement/**|\
              internal/githubwebhook/*|internal/githubwebhook/**|\
              internal/authprovider/*|internal/authprovider/**|\
              internal/authsaml/*|internal/authsaml/**|\
              internal/authsso/*|internal/authsso/**|\
              internal/authidentity/*|internal/authidentity/**|\
              internal/authstate/*|internal/authstate/**|\
              internal/requestactor/*|internal/requestactor/**|\
              internal/rbacpolicy/*|internal/rbacpolicy/**|\
              internal/statusstore/*|internal/statusstore/**|\
              internal/resourceaws/*|internal/resourceaws/**|\
              internal/resourcelogs/*|internal/resourcelogs/**|\
              internal/resourceinspection/*|internal/resourceinspection/**|\
              internal/planpreview/*|internal/planpreview/**|\
              internal/applyrequest/*|internal/applyrequest/**|\
              internal/auditlog/*|internal/auditlog/**)
                should_run=true
                break
                ;;
            esac
          done < /tmp/tenet-docker-smoke-changed-files.txt

          echo "should-run=$should_run" >> "$GITHUB_OUTPUT"
          if [[ "$should_run" == "true" ]]; then
            echo "Docker smoke required because this PR touches a Compose/front-door/auth/API/controller, local desired-state/status fixture, catalog/domain/placement status read model, RBAC policy diagnostics, GitHub webhook, resource evidence/logs/inspection, or plan/apply/audit persistence smoke surface."
          else
            echo "Docker smoke skipped because this PR does not touch a Compose/front-door/auth/API/controller, local desired-state/status fixture, catalog/domain/placement status read model, RBAC policy diagnostics, GitHub webhook, resource evidence/logs/inspection, or plan/apply/audit persistence smoke surface."
          fi

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: docker-smoke-scope
    if: needs.docker-smoke-scope.outputs.should-run == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Syntax-check docker smoke script
        run: bash -n scripts/smoke-docker.sh

      - name: Run docker smoke test
        run: make smoke-docker
