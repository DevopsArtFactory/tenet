name: CI Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-smoke:
    name: Fast smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Syntax-check local smoke script
        run: bash -n scripts/smoke-local.sh

      - name: Syntax-check docker smoke script
        run: bash -n scripts/smoke-docker.sh

      - name: Syntax-check runner evidence helper
        run: bash -n scripts/ci-smoke-runner-evidence.sh

      - name: Run local smoke test
        run: make smoke-local

  docker-smoke-scope:
    name: Docker smoke scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should-run: ${{ steps.scope.outputs.should-run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether Docker smoke is required
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" || ("$EVENT_NAME" == "push" && "$REF" == "refs/heads/main") ]]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "Docker smoke required for $EVENT_NAME on $REF."
            exit 0
          fi

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "Docker smoke skipped for unsupported event $EVENT_NAME."
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee /tmp/tenet-docker-smoke-changed-files.txt
          should_run=false
          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/workflows/ci-smoke.yml|\
              Makefile|\
              Dockerfile|\
              compose.yaml|\
              scripts/smoke-docker.sh|\
              scripts/docker-up.sh|\
              examples/local-repo/*|examples/local-repo/**|\
              examples/local-status/*|examples/local-status/**|\
              cmd/tenet-api/*|cmd/tenet-api/**|\
              cmd/tenet-controller/*|cmd/tenet-controller/**|\
              internal/api/*|internal/api/**|\
              internal/catalog/*|internal/catalog/**|\
              internal/domain/*|internal/domain/**|\
              internal/placement/*|internal/placement/**|\
              internal/githubwebhook/*|internal/githubwebhook/**|\
              internal/authprovider/*|internal/authprovider/**|\
              internal/authsaml/*|internal/authsaml/**|\
              internal/authsso/*|internal/authsso/**|\
              internal/authidentity/*|internal/authidentity/**|\
              internal/authstate/*|internal/authstate/**|\
              internal/requestactor/*|internal/requestactor/**|\
              internal/rbacpolicy/*|internal/rbacpolicy/**|\
              internal/statusstore/*|internal/statusstore/**|\
              internal/resourceaws/*|internal/resourceaws/**|\
              internal/resourcelogs/*|internal/resourcelogs/**|\
              internal/resourceinspection/*|internal/resourceinspection/**|\
              internal/planpreview/*|internal/planpreview/**|\
              internal/applyrequest/*|internal/applyrequest/**|\
              internal/auditlog/*|internal/auditlog/**)
                should_run=true
                break
                ;;
            esac
          done < /tmp/tenet-docker-smoke-changed-files.txt

          echo "should-run=$should_run" >> "$GITHUB_OUTPUT"
          if [[ "$should_run" == "true" ]]; then
            echo "Docker smoke required because this PR touches a Compose/front-door/auth/API/controller, local desired-state/status fixture, catalog/domain/placement status read model, GitHub webhook, resource evidence/logs/inspection, or plan/apply/audit persistence smoke surface."
          else
            echo "Docker smoke skipped because this PR does not touch a Compose/front-door/auth/API/controller, local desired-state/status fixture, catalog/domain/placement status read model, GitHub webhook, resource evidence/logs/inspection, or plan/apply/audit persistence smoke surface."
          fi

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: docker-smoke-scope
    if: needs.docker-smoke-scope.outputs.should-run == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Syntax-check docker smoke script
        run: bash -n scripts/smoke-docker.sh

      - name: Run docker smoke test
        run: make smoke-docker
